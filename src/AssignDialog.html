<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; margin: 10px; color: #000; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  #list { max-height: 260px; overflow-y: auto; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; }
  label { display: block; padding: 4px 2px; cursor: pointer; }
  button { margin-right: 8px; padding: 4px 10px; }
  #status { font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
  <h3>Assigned To — <?= taskName ?></h3>
  <div id="list">
    <? for (var i = 0; i < names.length; i++) { ?>
      <label>
        <input type="checkbox" value="<?= names[i] ?>" <?= selected.indexOf(names[i].toLowerCase()) !== -1 ? 'checked' : '' ?>>
        <?= names[i] ?>
      </label>
    <? } ?>
  </div>
  <button onclick="save()">Simpan</button>
  <button onclick="google.script.host.close()">Batal</button>
  <div id="status"></div>
<script>
  function save() {
    var boxes = document.querySelectorAll('#list input[type=checkbox]:checked');
    var chosen = Array.prototype.map.call(boxes, function (b) { return b.value; });
    document.getElementById('status').textContent = 'Menyimpan...';
    google.script.run.withSuccessHandler(function () {
      google.script.host.close();
    }).withFailureHandler(function (err) {
      document.getElementById('status').textContent = 'Gagal menyimpan: ' + err.message;
    }).saveAssignedTo(<?= row ?>, chosen.join(', '));
  }
</script>
</body>
</html>
