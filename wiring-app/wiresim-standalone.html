<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireSim Web — Simulator Otomasi Industri</title>
<style>
:root{
  --bg-header:#ffffff;
  --bg-toolbar:#1a2029;
  --bg-toolbar2:#20272f;
  --bg-canvas:#eef1f4;
  --grid-dot:#c7cfd6;
  --accent:#0d84ff;
  --accent-green:#2fbf6a;
  --accent-yellow:#f4b400;
  --accent-red:#e5484d;
  --text-light:#e8edf2;
  --text-dim:#9aa6b2;
  --panel-bg:#242b34;
  --panel-border:#333c47;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#000;color:var(--text-light);}
.app{display:flex;flex-direction:column;height:100vh;max-width:720px;margin:0 auto;background:#fff;overflow:hidden;}

/* ---------- Brand header ---------- */
.brand-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:var(--bg-header);color:#1a2029;flex:0 0 auto;
  border-bottom:1px solid #eee;
}
.brand-header .icon-btn{margin-right:2px;}
.brand-logo{display:flex;align-items:center;}
.brand-title{font-weight:800;font-size:20px;letter-spacing:.3px;color:#1a2029;}
.brand-title span{color:var(--accent);font-weight:800;}
.brand-actions{margin-left:auto;display:flex;gap:6px;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:#333;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{background:#f0f0f0;}
.icon-btn svg{width:20px;height:20px;}
.icon-btn.small{width:26px;height:26px;color:#cfd8e2;}
.icon-btn.small:hover{background:#333c47;}

/* ---------- Editor shell ---------- */
.editor{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-toolbar);color:var(--text-light);}

.editor-titlebar{
  display:flex;align-items:center;gap:10px;padding:8px 10px;background:#12161c;flex:0 0 auto;
}
.editor-titlebar .tbtn{background:transparent;border:none;color:var(--text-light);font-size:16px;cursor:pointer;padding:6px;border-radius:6px;}
.editor-titlebar .tbtn:hover{background:#232a33;}
.doc-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.doc-title .doc-icon{font-size:16px;}
.spacer{flex:1;}
.timer{font-size:12px;color:var(--text-dim);margin-right:6px;}

.editor-toolbar{
  display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg-toolbar);
  overflow-x:auto;flex:0 0 auto;border-bottom:1px solid #10151b;
}
.editor-toolbar .tbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:none;background:#2a323d;
  color:var(--text-light);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}
.editor-toolbar .tbtn svg{width:18px;height:18px;}
.editor-toolbar .tbtn:hover{background:#39424f;}
.editor-toolbar .tbtn.active-yellow{background:var(--accent-yellow);color:#302400;}
.editor-toolbar .tbtn.active-blue{background:var(--accent);color:#fff;}
.editor-toolbar .tbtn.toggled{outline:2px solid #fff;}
.zoom-group{display:flex;align-items:center;gap:0;margin-left:4px;background:#2a323d;border-radius:8px;overflow:hidden;flex:0 0 auto;}
.zoom-group .tbtn{background:transparent;border-radius:0;width:30px;}
.zoom-group span{width:48px;text-align:center;font-size:12px;color:var(--text-dim);}

.editor-modebar{
  display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-toolbar2);flex:0 0 auto;
}
.mbtn{
  height:34px;padding:0 14px;border-radius:8px;border:none;background:#3a424d;color:#fff;
  font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.mbtn svg{width:16px;height:16px;}
.mbtn.active{background:var(--accent);}
.mbtn.play{background:var(--accent-green);width:44px;padding:0;font-size:15px;}
.mbtn.play.on{background:var(--accent-red);}
.mbtn.wire-on{background:var(--accent);outline:2px solid #fff;}

.sheet-tabs{
  display:flex;align-items:center;gap:6px;padding:6px 10px;background:#171d24;overflow-x:auto;flex:0 0 auto;
}
.sheet-tab{
  display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:#2a323d;color:var(--text-dim);
  font-size:12px;cursor:pointer;white-space:nowrap;
}
.sheet-tab.active{background:var(--accent);color:#fff;}
.sheet-tab-actions{display:flex;gap:4px;margin-left:6px;}
.sheet-tab-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:12px;padding:2px;}
.sheet-add{width:28px;height:28px;border-radius:6px;background:#2a323d;color:#fff;border:none;cursor:pointer;font-size:16px;flex:0 0 auto;}

/* ---------- Workspace ---------- */
.workspace{flex:1;display:flex;min-height:0;position:relative;background:var(--bg-canvas);}

.palette, .layers{
  width:210px;flex:0 0 auto;background:var(--panel-bg);color:var(--text-light);
  border-right:1px solid var(--panel-border);overflow-y:auto;display:none;
}
.palette.open, .layers.open{display:block;}
.palette-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--panel-border);}
.palette-head h3{margin:0;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
.palette-list{padding:8px;display:flex;flex-direction:column;gap:6px;}
.palette-item{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#2a323d;cursor:grab;
  border:1px solid transparent;
  touch-action:none;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
}
.palette-item:hover{border-color:var(--accent);}
.palette-item svg{width:34px;height:34px;flex:0 0 auto;}
.palette-item span{font-size:12px;line-height:1.25;}
.palette-section{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#7b8794;padding:10px 4px 2px;font-weight:700;}
.palette-section:first-child{padding-top:2px;}
.layers-list{padding:8px;display:flex;flex-direction:column;gap:4px;}
.layer-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:#2a323d;font-size:12px;cursor:pointer;}
.layer-row.selected{outline:1px solid var(--accent);}
.layer-row .dot{width:8px;height:8px;border-radius:50%;background:#556;}
.layer-row .del{margin-left:auto;background:none;border:none;color:#e5484d;cursor:pointer;}

.canvas-wrap{flex:1;overflow:hidden;position:relative;background:
  radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0/22px 22px, var(--bg-canvas);
  cursor:default;touch-action:none;
}
.canvas-wrap.pan-mode{cursor:grab;}
.canvas-wrap.pan-mode.panning{cursor:grabbing;}
.canvas-wrap.wire-mode{cursor:crosshair;}

.canvas-world{position:absolute;left:0;top:0;width:4000px;height:3000px;transform-origin:0 0;}
#wireLayer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
#componentLayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
.comp{pointer-events:auto;}

.hint{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  background:rgba(20,24,30,.85);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
.hint.show{opacity:1;}

/* ---------- Components on canvas ---------- */
.comp{
  position:absolute;cursor:pointer;user-select:none;
  touch-action:none;-webkit-user-drag:none;-webkit-touch-callout:none;
}
.comp.selected .comp-body{outline:2px solid var(--accent);outline-offset:2px;}
.comp .comp-label{
  position:absolute;left:50%;top:100%;transform:translateX(-50%);
  font-size:10px;color:#333;white-space:nowrap;margin-top:2px;background:rgba(255,255,255,.75);
  padding:0 3px;border-radius:3px;
}
.comp.energized .glow{filter:drop-shadow(0 0 6px #ffd23c);}
.comp.spin .motor-spoke{animation:wiresim-spin 1.1s linear infinite;transform-origin:40px 40px;}
@keyframes wiresim-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.term{
  position:absolute;width:10px;height:10px;border-radius:50%;background:#666;border:2px solid #fff;
  transform:translate(-50%,-50%);z-index:5;touch-action:none;
}
.term:hover{background:var(--accent);}
.term.energized{background:var(--accent-red);box-shadow:0 0 6px var(--accent-red);}
.term.pending{outline:2px dashed var(--accent);}

.wire-line{stroke:#4a5568;stroke-width:3;fill:none;pointer-events:stroke;cursor:pointer;}
.wire-line.energized{stroke:#ff9500;stroke-width:3.5;}
.wire-line.selected{stroke:var(--accent);stroke-dasharray:6 4;}
.wire-temp{stroke:#0d84ff;stroke-width:2;stroke-dasharray:5 5;fill:none;pointer-events:none;}

/* ---------- Float tools ---------- */
.float-tools{
  position:absolute;right:10px;top:14px;display:flex;flex-direction:column;gap:10px;z-index:20;
}
.fbtn{
  width:44px;height:44px;border-radius:50%;border:none;background:#12161c;color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.fbtn.active{background:var(--accent);}
.fbtn.danger{background:#2a323d;}
.fbtn.danger:hover{background:var(--accent-red);}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  background:#12161c;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:80%;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- Tutorial popover ---------- */
.tutorial-pop{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#fff;color:#1a2029;padding:18px 20px;border-radius:12px;max-width:320px;font-size:13px;
  line-height:1.5;box-shadow:0 10px 40px rgba(0,0,0,.4);display:none;z-index:200;
}
.tutorial-pop.show{display:block;}
.tutorial-pop h4{margin:0 0 8px;font-size:15px;}
.tutorial-pop button{margin-top:12px;background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;}

/* scrollbars */
.editor-toolbar::-webkit-scrollbar, .sheet-tabs::-webkit-scrollbar{height:4px;}
.editor-toolbar::-webkit-scrollbar-thumb, .sheet-tabs::-webkit-scrollbar-thumb{background:#39424f;border-radius:4px;}

</style>
</head>
<body>
<div class="app">

  <!-- Brand header -->
  <header class="brand-header">
    <button class="icon-btn" id="btnHome" title="Beranda">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="brand-logo">
      <svg viewBox="0 0 64 64" width="34" height="34">
        <rect x="4" y="6" width="56" height="40" rx="4" fill="#1b2530" stroke="#0d84ff" stroke-width="2"/>
        <circle cx="10" cy="12" r="1.6" fill="#ff5d5d"/>
        <circle cx="15" cy="12" r="1.6" fill="#ffce54"/>
        <circle cx="20" cy="12" r="1.6" fill="#38d67a"/>
        <path d="M16 18v22" stroke="#0d84ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M30 18v22M26 22h8M26 30h8M26 38h8" stroke="#ff9a3c" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 14 L36 32 L42 32 L38 46 L52 26 L45 26 Z" fill="#ffce29" stroke="#c98f00" stroke-width="1"/>
      </svg>
    </div>
    <div class="brand-title">WireSim<span>WEB</span></div>
    <div class="brand-actions">
      <button class="icon-btn" title="Cari">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" title="Opsi lainnya">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <!-- Editor -->
  <section class="editor">

    <div class="editor-titlebar">
      <button class="tbtn" id="btnBack" title="Kembali">←</button>
      <div class="doc-title">
        <span class="doc-icon">🖥️</span>
        <span id="docName" contenteditable="false">Panel Otomasi Industri</span>
      </div>
      <div class="spacer"></div>
      <span class="timer" id="timer">00:00</span>
      <button class="tbtn" id="btnRefresh" title="Ulangi simulasi">⟳</button>
      <button class="tbtn" id="btnExpand" title="Layar penuh">⤢</button>
    </div>

    <div class="editor-toolbar" id="editorToolbar">
      <button class="tbtn" id="btnMenu" title="Komponen">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="tbtn" id="btnTools" title="Pengaturan grid">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a2 2 0 0 0 0-2.8L12.5 1.3a2 2 0 0 0-2.8 0L2.3 8.7a2 2 0 0 0 0 2.8l2.2 2.2a2 2 0 0 0 2.8 0z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M16 12l6 6-2 2-6-6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tbtn" id="btnTree" title="Daftar komponen">
        <svg viewBox="0 0 24 24"><path d="M6 3v10a4 4 0 0 0 4 4h8M6 3H4M6 9H4M6 15H4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="20" cy="17" r="2" fill="currentColor"/></svg>
      </button>
      <button class="tbtn" id="btnDoc" title="Lembar baru">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15 2v5h5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tbtn active-yellow" id="btnTutorial" title="Tutorial singkat">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 8-4v6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M6 10.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      </button>
      <button class="tbtn active-blue" id="btnCollab" title="Mode kolaborasi">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M14 20c0-2.4 1.7-4.3 4-4.9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="tbtn" id="btnLang" title="Bahasa">🌐</button>
      <button class="tbtn" id="btnPan" title="Geser tampilan">✋</button>
      <button class="tbtn" id="btnRename" title="Ganti nama lembar">✏️</button>
      <div class="zoom-group">
        <button class="tbtn" id="zoomOut">−</button>
        <span id="zoomLabel">100%</span>
        <button class="tbtn" id="zoomIn">+</button>
      </div>
    </div>

    <div class="editor-modebar">
      <button class="mbtn active" id="modeSelect" data-mode="select" title="Pilih / pindahkan">
        <svg viewBox="0 0 24 24"><path d="M4 3l7 18 2.5-7.5L21 11z" fill="currentColor"/></svg>
      </button>
      <button class="mbtn play" id="btnSimulate" title="Jalankan simulasi">▶</button>
      <button class="mbtn" id="modeWire" data-mode="wire" title="Sambungkan kabel">KABEL</button>
    </div>

    <div class="sheet-tabs" id="sheetTabs"></div>

    <div class="workspace">
      <aside class="palette" id="palette">
        <div class="palette-head">
          <h3>Komponen</h3>
          <button class="icon-btn small" id="btnClosePalette">✕</button>
        </div>
        <div class="palette-list" id="paletteList"></div>
      </aside>

      <aside class="layers" id="layersPanel">
        <div class="palette-head">
          <h3>Di lembar ini</h3>
          <button class="icon-btn small" id="btnCloseLayers">✕</button>
        </div>
        <div class="layers-list" id="layersList"></div>
      </aside>

      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas-world" id="world" style="transform: translate(0px,0px) scale(1);">
          <svg id="wireLayer" width="4000" height="3000"></svg>
          <div id="componentLayer"></div>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="float-tools">
        <button class="fbtn" id="btnMultimeter" title="Multimeter (ukur kabel)">🧪</button>
        <button class="fbtn" id="btnValidate" title="Validasi rangkaian">✓</button>
        <button class="fbtn danger" id="btnDelete" title="Hapus yang dipilih">🗑</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="tutorial-pop" id="tutorialPop"></div>
</div>

<script>
/* ============================================================
   WireSim Web — original HTML/CSS/JS clone of an industrial
   automation wiring/circuit simulator UI. Not affiliated with
   or copying assets from any third-party product. Component
   names reference common brands/models sold in Indonesia
   (Chint, Schneider Electric, ABB) purely as realistic labels
   for educational purposes.
   ============================================================ */

(() => {
"use strict";

/* ---------------- Component library ---------------- */

const svg = (w,h,inner) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const COMP_DEFS = {

  /* ---- Fontes / Sources ---- */
  power: {
    label: { id:"Catu Daya 24V DC", en:"24V DC Power Supply" }, w: 110, h: 100, isSource: true,
    terminals: [
      { id:"V1", x:14, y:100, pole:"pos" }, { id:"V2", x:34, y:100, pole:"pos" },
      { id:"N1", x:62, y:100, pole:"neg" }, { id:"N2", x:82, y:100, pole:"neg" },
      { id:"OK", x:100,y:100, pole:"signal" }
    ],
    icon: (c) => svg(110,100,`
      <rect x="2" y="2" width="106" height="96" rx="8" fill="#1b2530" stroke="#0d84ff" stroke-width="2"/>
      <circle cx="16" cy="16" r="4" fill="#ffce54"/>
      <text x="55" y="40" text-anchor="middle" fill="#58b8ff" font-size="18" font-weight="800">24V</text>
      <text x="55" y="58" text-anchor="middle" fill="#8fa6b8" font-size="10">DC 2.5A</text>
      <text x="14" y="94" fill="#5fd88a" font-size="8">+V</text><text x="34" y="94" fill="#5fd88a" font-size="8">+V</text>
      <text x="58" y="94" fill="#ff8a8a" font-size="8">-V</text><text x="78" y="94" fill="#ff8a8a" font-size="8">-V</text>
    `)
  },
  acSource: {
    label: { id:"Sumber AC 220V", en:"220V AC Source" }, w: 100, h: 90, isSource: true,
    terminals: [ { id:"L", x:20, y:90, pole:"pos" }, { id:"N", x:70, y:90, pole:"neg" } ],
    icon: (c) => svg(100,90,`
      <rect x="2" y="2" width="96" height="78" rx="8" fill="#1b2530" stroke="#f4b400" stroke-width="2"/>
      <path d="M12 45 q8 -18 16 0 t16 0 t16 0 t16 0" stroke="#f4b400" stroke-width="2.5" fill="none"/>
      <text x="50" y="30" text-anchor="middle" fill="#ffd873" font-size="15" font-weight="800">220V</text>
      <text x="20" y="72" fill="#5fd88a" font-size="8">L</text><text x="70" y="72" fill="#ff8a8a" font-size="8">N</text>
    `)
  },
  threePhaseSource: {
    label: { id:"Sumber 3 Fasa 380V", en:"3-Phase 380V Source" }, w: 120, h: 90, isSource: true,
    terminals: [
      { id:"L1", x:15, y:90, pole:"pos" }, { id:"L2", x:40, y:90, pole:"pos" },
      { id:"L3", x:65, y:90, pole:"pos" }, { id:"N", x:100, y:90, pole:"neg" }
    ],
    icon: (c) => svg(120,90,`
      <rect x="2" y="2" width="116" height="78" rx="8" fill="#1b2530" stroke="#f4b400" stroke-width="2"/>
      <text x="60" y="32" text-anchor="middle" fill="#ffd873" font-size="14" font-weight="800">380V</text>
      <text x="60" y="50" text-anchor="middle" fill="#8fa6b8" font-size="9">3~ 50/60Hz</text>
      <text x="12" y="72" fill="#5fd88a" font-size="7">L1</text><text x="37" y="72" fill="#5fd88a" font-size="7">L2</text>
      <text x="62" y="72" fill="#5fd88a" font-size="7">L3</text><text x="94" y="72" fill="#ff8a8a" font-size="7">N</text>
    `)
  },
  switchingSupply: {
    label: { id:"Power Supply Switching (Schneider ABL8)", en:"Switching Power Supply (Schneider ABL8)" },
    w: 130, h: 110, converter: { inHot:"L", inReturn:"N" },
    terminals: [
      { id:"L", x:15, y:0 }, { id:"N", x:35, y:0 },
      { id:"+V", x:80, y:110, pole:"pos" }, { id:"-V", x:105, y:110, pole:"neg" }
    ],

/* ---------------- Persistence ---------------- */
function save() {
  try { localStorage.setItem("wiresim_state", JSON.stringify({ sheets, currentSheetId, uidN })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem("wiresim_state");
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.sheets || !data.sheets.length) return false;
    sheets = data.sheets; currentSheetId = data.currentSheetId; uidN = data.uidN || 1;
    return true;
  } catch (e) { return false; }
}

/* ---------------- Instance state helpers ---------------- */
function makeInitialState(type, def, extra) {
  const state = {};
  if (def.switchable) state.closed = !!def.defaultClosed;
  if (def.selector3) state.pos = def.defaultPos ?? 1;
  if (def.coil) {
    state.energized = false;
    if (def.timer) { state.wasEnergized = false; state.contactClosed = false; state.delayMs = def.defaultDelayMs || 3000; }
  }
  if (def.converter) state.on = false;
  if (def.isLoad) state.on = false;
  if (type === "lamp") state.color = "#ffce29";
  return Object.assign(state, extra || {});
}

/* ---------------- Rendering: components + wires ---------------- */
function terminalKeyState(k) {
  if (currentPosNet.has(k)) return "pos";
  if (currentNegNet.has(k)) return "neg";
  return null;
}

function renderComponents() {
  componentLayer.innerHTML = "";
  const sheet = getSheet();
  if (!sheet) return;
  sheet.components.forEach(comp => {
    const def = COMP_DEFS[comp.type];
    const el = document.createElement("div");
    el.className = "comp" + (comp.id === selectedCompId ? " selected" : "");
    const energized = def.isLoad ? comp.state.on
      : def.coil ? comp.state.energized
      : def.converter ? comp.state.on
      : def.isSource ? simulating
      : false;
    if (energized) el.classList.add("energized");
    if ((comp.type === "motor" || comp.type === "threePhaseMotor") && energized) el.classList.add("spin");
    el.style.left = comp.x + "px"; el.style.top = comp.y + "px";
    el.style.width = def.w + "px"; el.style.height = def.h + "px";
    el.dataset.id = comp.id;
    el.innerHTML = `<div class="comp-body glow">${def.icon(comp)}</div><div class="comp-label">${compLabel(comp)}</div>`;
    def.terminals.forEach(term => {
      const td = document.createElement("div");
      td.className = "term";
      td.style.left = term.x + "px"; td.style.top = term.y + "px";
      const st = terminalKeyState(key(comp.id, term.id));
      if (simulating && st) td.classList.add("energized");
      if (pendingWire && pendingWire.compId === comp.id && pendingWire.terminalId === term.id) td.classList.add("pending");
      td.title = term.id;
      td.addEventListener("pointerdown", (e) => handleTerminalPointerDown(e, comp, term));
      el.appendChild(td);
    });
    el.addEventListener("pointerdown", (e) => handleCompPointerDown(e, comp));
    componentLayer.appendChild(el);
  });
}

function wirePath(sheet, w) {
  const ca = sheet.components.find(c => c.id === w.a.compId);
  const cb = sheet.components.find(c => c.id === w.b.compId);
  if (!ca || !cb) return null;
  const ta = COMP_DEFS[ca.type].terminals.find(t => t.id === w.a.terminalId);
  const tb = COMP_DEFS[cb.type].terminals.find(t => t.id === w.b.terminalId);
  if (!ta || !tb) return null;
  return { x1: ca.x + ta.x, y1: ca.y + ta.y, x2: cb.x + tb.x, y2: cb.y + tb.y };
}

function renderWires() {
  wireLayer.innerHTML = "";
  const sheet = getSheet();
  if (!sheet) return;
  sheet.wires.forEach(w => {
    const p = wirePath(sheet, w);
    if (!p) return;
    const mx = (p.x1 + p.x2) / 2;
    const d = `M ${p.x1} ${p.y1} C ${mx} ${p.y1}, ${mx} ${p.y2}, ${p.x2} ${p.y2}`;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    const ka = key(w.a.compId, w.a.terminalId), kb = key(w.b.compId, w.b.terminalId);
    const energized = simulating && (currentPosNet.has(ka) || currentNegNet.has(ka) || currentPosNet.has(kb) || currentNegNet.has(kb));
    path.setAttribute("class", "wire-line" + (energized ? " energized" : "") + (w.id === selectedWireId ? " selected" : ""));
    path.addEventListener("pointerdown", (e) => { e.stopPropagation(); onWireClick(w); });
    wireLayer.appendChild(path);
  });
  if (pendingWire) {
    const sheetNow = getSheet();
    const comp = sheetNow.components.find(c => c.id === pendingWire.compId);
    const term = COMP_DEFS[comp.type].terminals.find(t => t.id === pendingWire.terminalId);
    const x1 = comp.x + term.x, y1 = comp.y + term.y;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", pendingWire.mx ?? x1); line.setAttribute("y2", pendingWire.my ?? y1);
    line.setAttribute("class", "wire-temp");
    line.id = "tempWire";
    wireLayer.appendChild(line);
  }
}

function renderLayers() {
  layersList.innerHTML = "";
  const sheet = getSheet();
  if (!sheet) return;
  sheet.components.forEach(comp => {
    const row = document.createElement("div");
    row.className = "layer-row" + (comp.id === selectedCompId ? " selected" : "");
    row.innerHTML = `<span class="dot"></span><span>${compLabel(comp)}</span><button class="del" title="${t("tt_deleteRow")}">🗑</button>`;
    row.addEventListener("click", (e) => {
      if (e.target.closest(".del")) { deleteComponent(comp.id); return; }
      selectedCompId = comp.id; selectedWireId = null; renderAll();
    });
    layersList.appendChild(row);
  });
}

function renderAll() { renderComponents(); renderWires(); renderLayers(); }

/* ---------------- Transform / zoom / pan ---------------- */
function updateTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $("zoomLabel").textContent = Math.round(zoom * 100) + "%";
}
function worldPoint(clientX, clientY) {
  const rect = canvasWrap.getBoundingClientRect();
  return { x: (clientX - rect.left - panX) / zoom, y: (clientY - rect.top - panY) / zoom };
}

/* ---------------- Simulation ---------------- */
function buildAdjacency(sheet) {
  const adj = {};
  const link = (k1, k2) => { (adj[k1] = adj[k1] || new Set()).add(k2); (adj[k2] = adj[k2] || new Set()).add(k1); };
  sheet.wires.forEach(w => link(key(w.a.compId, w.a.terminalId), key(w.b.compId, w.b.terminalId)));
  sheet.components.forEach(c => {
    const def = COMP_DEFS[c.type];
    if (def.switchable && c.state.closed) {
      const ids = def.terminals.map(x => x.id);
      link(key(c.id, ids[0]), key(c.id, ids[1]));
    }
    if (def.selector3) {
      if (c.state.pos === 0) link(key(c.id,"C"), key(c.id,"NO1"));
      else if (c.state.pos === 2) link(key(c.id,"C"), key(c.id,"NO2"));
    }
    if (def.coil && def.contacts) {
      def.contacts.forEach(ct => {
        const active = ct.useDelay ? !!c.state.contactClosed : (ct.type === "NO" ? c.state.energized : !c.state.energized);
        if (active) link(key(c.id, ct.a), key(c.id, ct.b));
      });
    }
    if (def.bus) {
      const ids = def.terminals.map(x => x.id);
      for (let i = 1; i < ids.length; i++) link(key(c.id, ids[0]), key(c.id, ids[i]));
    }
  });
  return adj;
}
function bfs(adj, seeds) {
  const visited = new Set(seeds), queue = [...seeds];
  while (queue.length) {
    const cur = queue.shift();
    (adj[cur] || new Set()).forEach(n => { if (!visited.has(n)) { visited.add(n); queue.push(n); } });
  }
  return visited;
}
function seedKeys(sheet, pole) {
  const out = [];
  sheet.components.forEach(c => {
    const def = COMP_DEFS[c.type];
    if (def.isSource) def.terminals.forEach(term => { if (term.pole === pole) out.push(key(c.id, term.id)); });
    if (def.converter && c.state.on) def.terminals.forEach(term => { if (term.pole === pole) out.push(key(c.id, term.id)); });
  });
  return out;
}
function computeNets(sheet) {
  let posNet = new Set(), negNet = new Set();
  for (let iter = 0; iter < 6; iter++) {
    const adj = buildAdjacency(sheet);
    posNet = bfs(adj, seedKeys(sheet, "pos"));
    negNet = bfs(adj, seedKeys(sheet, "neg"));
    sheet.components.forEach(c => {
      const def = COMP_DEFS[c.type];
      if (def.coil) {
        c.state.energized = posNet.has(key(c.id, "A1")) && negNet.has(key(c.id, "A2"));
        if (def.timer) {
          if (c.state.energized) {
            if (!c.state.wasEnergized) { c.state.energizedAt = Date.now(); c.state.wasEnergized = true; }
            c.state.contactClosed = (Date.now() - c.state.energizedAt) >= (c.state.delayMs || def.defaultDelayMs || 3000);
          } else {
            c.state.wasEnergized = false;
            c.state.contactClosed = false;
          }
        }
      }
      if (def.converter) {
        c.state.on = posNet.has(key(c.id, def.converter.inHot)) && negNet.has(key(c.id, def.converter.inReturn));
      }
    });
  }
  return { posNet, negNet };
}
function updateLoadStates(sheet, posNet, negNet) {
  sheet.components.forEach(c => {
    const def = COMP_DEFS[c.type];
    if (def.isLoad) {
      const hasPos = def.terminals.some(term => posNet.has(key(c.id, term.id)));
      const hasNeg = def.terminals.some(term => negNet.has(key(c.id, term.id)));
      c.state.on = hasPos && hasNeg;
    }
  });
}
function runSimulation() {
  const sheet = getSheet();
  if (!simulating || !sheet) { currentPosNet = new Set(); currentNegNet = new Set(); return; }
  const { posNet, negNet } = computeNets(sheet);
  currentPosNet = posNet; currentNegNet = negNet;
  updateLoadStates(sheet, posNet, negNet);
}

function setSimulating(on) {
  simulating = on;
  const btn = $("btnSimulate");
  btn.classList.toggle("on", on);
  btn.textContent = on ? "■" : "▶";
  if (on) {
    simSeconds = 0;
    simTimer = setInterval(() => {
      simSeconds++;
      const m = String(Math.floor(simSeconds/60)).padStart(2,"0");
      const s = String(simSeconds%60).padStart(2,"0");
      $("timer").textContent = `${m}:${s}`;
    }, 1000);
    simTickTimer = setInterval(() => { runSimulation(); renderAll(); }, 300);
  } else {
    clearInterval(simTimer); simTimer = null; $("timer").textContent = "00:00";
    clearInterval(simTickTimer); simTickTimer = null;
  }
  runSimulation();
  renderAll();
  toast(on ? t("sim_on") : t("sim_off"));
}

/* ---------------- Component add / move / delete ---------------- */
function addComponent(type, x, y, extra) {
  const def = COMP_DEFS[type];
  const state = makeInitialState(type, def, extra);
  const comp = { id: uid("c"), type, x: Math.round(x - def.w/2), y: Math.round(y - def.h/2), state };
  getSheet().components.push(comp);
  selectedCompId = comp.id; selectedWireId = null;
  runSimulation(); renderAll(); save();
}
function deleteComponent(id) {
  const sheet = getSheet();
  sheet.components = sheet.components.filter(c => c.id !== id);
  sheet.wires = sheet.wires.filter(w => w.a.compId !== id && w.b.compId !== id);
  if (selectedCompId === id) selectedCompId = null;
  runSimulation(); renderAll(); save();
}
function deleteWire(id) {
  const sheet = getSheet();
  sheet.wires = sheet.wires.filter(w => w.id !== id);
  if (selectedWireId === id) selectedWireId = null;
  runSimulation(); renderAll(); save();
}
function deleteSelected() {
  if (selectedCompId) { deleteComponent(selectedCompId); toast(t("deleted")); }
  else if (selectedWireId) { deleteWire(selectedWireId); toast(t("deleted")); }
  else toast(t("noSelection"));
}
function deselectAll() { selectedCompId = null; selectedWireId = null; pendingWire = null; }

/* ---------------- Pointer interaction ---------------- */
function handleCompPointerDown(e, comp) {
  if (multimeterOn) { e.stopPropagation(); showMeasurement(comp, null); return; }
  if (mode === "wire") return;
  if (simulating) {
    const def = COMP_DEFS[comp.type];
    if (def.switchable) { comp.state.closed = !comp.state.closed; runSimulation(); renderAll(); save(); }
    else if (def.selector3) { comp.state.pos = (comp.state.pos + 1) % 3; runSimulation(); renderAll(); save(); }
    else if (def.coil) toast(`${compLabel(comp)}: ${comp.state.energized ? t("coilOn") : t("coilOff")}`);
    else if (def.converter) toast(`${compLabel(comp)}: ${comp.state.on ? t("converterOn") : t("converterOff")}`);
    else if (def.isLoad) toast(`${compLabel(comp)}: ${comp.state.on ? t("loadOn") : t("loadOff")}`);
    return;
  }
  e.stopPropagation();
  selectedCompId = comp.id; selectedWireId = null;
  const wp = worldPoint(e.clientX, e.clientY);
  dragState = { id: comp.id, dx: wp.x - comp.x, dy: wp.y - comp.y };
  renderAll();
  window.addEventListener("pointermove", onCompDragMove);
  window.addEventListener("pointerup", onCompDragUp, { once: true });
}
function onCompDragMove(e) {
  if (!dragState) return;
  const sheet = getSheet();
  const comp = sheet.components.find(c => c.id === dragState.id);
  if (!comp) return;
  const wp = worldPoint(e.clientX, e.clientY);
  comp.x = Math.round(wp.x - dragState.dx);
  comp.y = Math.round(wp.y - dragState.dy);
  renderComponents(); renderWires();
}
function onCompDragUp() {
  dragState = null;
  window.removeEventListener("pointermove", onCompDragMove);
  save();
}

function handleTerminalPointerDown(e, comp, term) {
  e.stopPropagation();
  if (multimeterOn) { showMeasurement(comp, term); return; }
  if (mode !== "wire") { handleCompPointerDown(e, comp); return; }
  if (!pendingWire) {
    pendingWire = { compId: comp.id, terminalId: term.id };
    renderComponents(); renderWires();
    window.addEventListener("pointermove", onWireTempMove);
  } else {
    if (pendingWire.compId === comp.id && pendingWire.terminalId === term.id) {
      pendingWire = null;
    } else {
      const sheet = getSheet();
      const exists = sheet.wires.some(w =>
        (w.a.compId===pendingWire.compId && w.a.terminalId===pendingWire.terminalId && w.b.compId===comp.id && w.b.terminalId===term.id) ||
        (w.b.compId===pendingWire.compId && w.b.terminalId===pendingWire.terminalId && w.a.compId===comp.id && w.a.terminalId===term.id));
      if (!exists) {
        sheet.wires.push({ id: uid("w"), a: { compId: pendingWire.compId, terminalId: pendingWire.terminalId }, b: { compId: comp.id, terminalId: term.id } });
        save();
      }
      pendingWire = null;
    }
    window.removeEventListener("pointermove", onWireTempMove);
    runSimulation();
    renderComponents(); renderWires();
  }
}
function onWireTempMove(e) {
  if (!pendingWire) return;
  const wp = worldPoint(e.clientX, e.clientY);
  pendingWire.mx = wp.x; pendingWire.my = wp.y;
  renderWires();
}
function onWireClick(w) {
  if (mode === "wire") return;
  selectedWireId = w.id; selectedCompId = null; renderAll();
}

/* Canvas background click: cancel pending wire / deselect / start pan */
canvasWrap.addEventListener("pointerdown", (e) => {
  if (e.target !== canvasWrap && e.target !== world) return;
  if (mode === "pan") {
    panState = { sx: e.clientX, sy: e.clientY, ox: panX, oy: panY };
    canvasWrap.classList.add("panning");
    window.addEventListener("pointermove", onPanMove);
    window.addEventListener("pointerup", onPanUp, { once: true });
    return;
  }
  if (pendingWire) { pendingWire = null; window.removeEventListener("pointermove", onWireTempMove); renderWires(); }
  deselectAll(); renderAll();
});
function onPanMove(e) {
  if (!panState) return;
  panX = panState.ox + (e.clientX - panState.sx);
  panY = panState.oy + (e.clientY - panState.sy);
  updateTransform();
}
function onPanUp() {
  panState = null; canvasWrap.classList.remove("panning");
  window.removeEventListener("pointermove", onPanMove);
}

/* Palette custom drag-to-place */
function startPaletteDrag(e, item) {
  e.preventDefault();
  const def = COMP_DEFS[item.type];
  const previewComp = { state: makeInitialState(item.type, def, item.extra) };
  const ghost = document.createElement("div");
  ghost.style.position = "fixed"; ghost.style.zIndex = 999; ghost.style.pointerEvents = "none";
  ghost.style.left = e.clientX - def.w/2 + "px"; ghost.style.top = e.clientY - def.h/2 + "px";
  ghost.style.opacity = "0.85";
  ghost.innerHTML = def.icon(previewComp);
  document.body.appendChild(ghost);
  showHint(paletteLabel(item));
  function move(ev) {
    ghost.style.left = ev.clientX - def.w/2 + "px";
    ghost.style.top = ev.clientY - def.h/2 + "px";
  }
  function up(ev) {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    ghost.remove(); hideHint();
    const rect = canvasWrap.getBoundingClientRect();
    if (ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
      const wp = worldPoint(ev.clientX, ev.clientY);
      addComponent(item.type, wp.x, wp.y, item.extra);
    }
  }
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

/* ---------------- Toolbar buttons ---------------- */
function setMode(m) {
  mode = m;
  pendingWire = null;
  window.removeEventListener("pointermove", onWireTempMove);
  $("modeSelect").classList.toggle("active", m === "select");
  $("modeWire").classList.toggle("wire-on", m === "wire");
  canvasWrap.classList.toggle("wire-mode", m === "wire");
  canvasWrap.classList.toggle("pan-mode", m === "pan");
  $("btnPan").classList.toggle("toggled", m === "pan");
  renderWires();
}
$("modeSelect").addEventListener("click", () => setMode("select"));
$("modeWire").addEventListener("click", () => setMode(mode === "wire" ? "select" : "wire"));
$("btnPan").addEventListener("click", () => setMode(mode === "pan" ? "select" : "pan"));
$("btnSimulate").addEventListener("click", () => setSimulating(!simulating));

$("btnMenu").addEventListener("click", () => { paletteEl.classList.toggle("open"); layersPanel.classList.remove("open"); });
$("btnClosePalette").addEventListener("click", () => paletteEl.classList.remove("open"));
$("btnTree").addEventListener("click", () => { layersPanel.classList.toggle("open"); paletteEl.classList.remove("open"); renderLayers(); });
$("btnCloseLayers").addEventListener("click", () => layersPanel.classList.remove("open"));

$("btnTools").addEventListener("click", () => {
  const grid = canvasWrap.style.backgroundImage === "none" ? "" : "none";
  canvasWrap.style.backgroundImage = grid;
  toast(grid === "none" ? t("gridOff") : t("gridOn"));
});
$("btnDoc").addEventListener("click", () => {
  const n = sheets.length + 1;
  const s = { id: uid("sheet"), name: `${t("sheetPrefix")} ${n}`, components: [], wires: [] };
  sheets.push(s); currentSheetId = s.id; deselectAll(); renderAll(); renderSheetTabs(); save();
  toast(t("newSheetToast"));
});
$("btnTutorial").addEventListener("click", showTutorial);
$("btnCollab").addEventListener("click", () => toast(t("collab")));
$("btnLang").addEventListener("click", () => {
  langIdx = (langIdx + 1) % LANGS.length;
  applyStaticI18n();
  renderPalette();
  renderAll();
  toast(lang() === "id" ? "Bahasa: Indonesia" : "Language: English");
});
$("btnRename").addEventListener("click", () => {
  const sheet = getSheet();
  const name = prompt(t("sheetNamePrompt"), sheet.name);
  if (name) { sheet.name = name; renderSheetTabs(); save(); }
});
$("btnRefresh").addEventListener("click", () => { setSimulating(false); toast(t("simReset")); });
$("btnExpand").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});

$("zoomIn").addEventListener("click", () => { zoom = Math.min(2.5, +(zoom + 0.1).toFixed(2)); updateTransform(); });
$("zoomOut").addEventListener("click", () => { zoom = Math.max(0.25, +(zoom - 0.1).toFixed(2)); updateTransform(); });
canvasWrap.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoom = Math.min(2.5, Math.max(0.25, +(zoom + (e.deltaY < 0 ? 0.08 : -0.08)).toFixed(2)));
  updateTransform();
}, { passive: false });

$("btnMultimeter").addEventListener("click", () => {
  multimeterOn = !multimeterOn;
  $("btnMultimeter").classList.toggle("active", multimeterOn);
  toast(multimeterOn ? t("multimeterOnMsg") : t("multimeterOffMsg"));
});
$("btnValidate").addEventListener("click", validateCircuit);
$("btnDelete").addEventListener("click", deleteSelected);

document.addEventListener("keydown", (e) => {
  if ((e.key === "Delete" || e.key === "Backspace") && !e.target.isContentEditable && document.activeElement.tagName !== "INPUT") {
    e.preventDefault(); deleteSelected();
  }
  if (e.key === "Escape") { pendingWire = null; deselectAll(); renderAll(); }
});

/* ---------------- Validate / measure / toast / tutorial ---------------- */
function validateCircuit() {
  const sheet = getSheet();
  let unconnected = 0;
  sheet.components.forEach(c => {
    const def = COMP_DEFS[c.type];
    def.terminals.forEach(term => {
      if (term.pole === "signal") return;
      const k = key(c.id, term.id);
      const wired = sheet.wires.some(w => key(w.a.compId,w.a.terminalId) === k || key(w.b.compId,w.b.terminalId) === k);
      if (!wired) unconnected++;
    });
  });
  toast(unconnected === 0 ? t("validateOk") : t("validateBad", unconnected));
}
function showMeasurement(comp, term) {
  const label0 = compLabel(comp);
  const def = COMP_DEFS[comp.type];
  let label, value;
  if (term) {
    const k = key(comp.id, term.id);
    const st = simulating ? terminalKeyState(k) : null;
    label = `${label0} · ${term.id}`;
    value = st === "pos" ? t("measurePos") : st === "neg" ? t("measureNeg") : t("measureNone");
  } else {
    label = label0;
    value = def.isLoad ? (comp.state.on ? t("converterOn") : t("measureNone"))
      : def.coil ? (comp.state.energized ? t("coilOn") : t("coilOff"))
      : def.converter ? (comp.state.on ? t("converterOn") : t("converterOff"))
      : "—";
  }
  toast(`${t("measure", value)} — ${label}`);
}
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
function showHint(msg) { hintEl.textContent = msg; hintEl.classList.add("show"); }
function hideHint() { hintEl.classList.remove("show"); }

let tutIdx = 0;
function showTutorial() {
  tutIdx = 0; renderTutorialStep();
  tutorialPop.classList.add("show");
}
function renderTutorialStep() {
  const steps = t("tutorialSteps");
  const step = steps[tutIdx];
  tutorialPop.innerHTML = `<h4>${step.title}</h4><p>${step.body}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="tutClose" style="background:#ccc;color:#111;">${t("tutClose")}</button>
      <button id="tutNext">${tutIdx < steps.length-1 ? t("tutNext") : t("tutFinish")}</button>
    </div>`;
  tutorialPop.querySelector("#tutClose").addEventListener("click", () => tutorialPop.classList.remove("show"));
  tutorialPop.querySelector("#tutNext").addEventListener("click", () => {
    if (tutIdx < steps.length - 1) { tutIdx++; renderTutorialStep(); }
    else tutorialPop.classList.remove("show");
  });
}

/* ---------------- Static text / tooltip translation ---------------- */
function applyStaticI18n() {
  document.title = t("appTitle");
  $("docName").textContent = t("docTitleDefault");
  $("btnBack").title = t("tt_back");
  $("btnRefresh").title = t("tt_refresh");
  $("btnExpand").title = t("tt_expand");
  $("btnMenu").title = t("tt_menu");
  $("btnTools").title = t("tt_tools");
  $("btnTree").title = t("tt_tree");
  $("btnDoc").title = t("tt_doc");
  $("btnTutorial").title = t("tt_tutorial");
  $("btnCollab").title = t("tt_collab");
  $("btnLang").title = t("tt_lang");
  $("btnPan").title = t("tt_pan");
  $("btnRename").title = t("tt_rename");
  $("zoomOut").title = t("tt_zoomOut");
  $("zoomIn").title = t("tt_zoomIn");
  $("btnMultimeter").title = t("tt_multimeter");
  $("btnValidate").title = t("tt_validate");
  $("btnDelete").title = t("tt_delete");
  $("modeSelect").title = t("tt_select");
  $("btnSimulate").title = t("tt_simulate");
}

/* ---------------- Init ---------------- */
function init() {
  if (!load()) {
    const s = demoSheet();
    sheets = [s]; currentSheetId = s.id;
  }
  applyStaticI18n();
  renderPalette();
  renderSheetTabs();
  updateTransform();
  renderAll();
  setMode("select");
}
init();

})();

</script>
